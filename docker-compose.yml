services:
  db:
    # pgvector image: Postgres plus the vector extension, so visual search in
    # Phase 2 needs no second datastore.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: khazana
      POSTGRES_PASSWORD: khazana
      POSTGRES_DB: khazana
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khazana -d khazana"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
