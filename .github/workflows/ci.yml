name: CI

on:
  push:
    # Feature branches are included deliberately. Without them a branch gets
    # no checks at all until it is opened as a pull request, which is exactly
    # when a late failure is most expensive to unpick.
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No em dashes, no AI attribution
        run: bash scripts/prepush-check.sh

  api:
    name: API lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Audit the installed Python packages
        # Fails on any published advisory in what the API actually installs.
        # Trivy cannot see these: there is no Python lockfile for it to read.
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off

      - name: Lint
        run: |
          ruff check .
          ruff format --check . || {
            # Print the unified diff inline as well as uploading it. The
            # development machine cannot run ruff, and artifact downloads from
            # that network have been unreliable, so the log is the fallback.
            echo "::group::formatting diff"
            ruff format --diff . || true
            echo "::endgroup::"
            ruff format --diff . > "$RUNNER_TEMP/format.patch" || true
            exit 1
          }

      - name: Upload the formatting patch when the format check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: ignore

      - name: Type check
        run: mypy src

      - name: Tests
        env:
          # Tests run against SQLite, so no database service is needed here.
          # The Postgres specific paths are covered by the migration job.
          SECRET_KEY: test-secret-not-a-real-key
          AI_OFFLINE: "true"
        run: pytest --cov=khazana --cov-report=term-missing

  migrations:
    name: Migrations apply cleanly on Postgres
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: khazana
          POSTGRES_PASSWORD: khazana
          POSTGRES_DB: khazana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khazana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Upgrade then downgrade, so rollbacks are proven too
        env:
          DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          SECRET_KEY: test-secret-not-a-real-key
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Seed, back up, restore into a scratch database and compare
        # A backup nobody has restored is a hope. This proves the backup
        # script's output restores to the same rows, table by table, on every
        # push. pg_dump runs inside the service container, matching its version.
        working-directory: .
        env:
          DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          SECRET_KEY: test-secret-not-a-real-key
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          (cd apps/api && python -m khazana.seed --reset)
          bash scripts/verify-restore.sh

      - name: Create the disposable test database
        env:
          PGPASSWORD: khazana
        # A separate database, because these tests drop every table. Pointing
        # them at the working database destroys it, which has happened once.
        run: psql -h localhost -U khazana -d khazana -c "CREATE DATABASE khazana_test"

      - name: PostgreSQL only tests, meaning vector search and the triggers
        env:
          # The suite runs on SQLite for speed, so the cosine ranking, the
          # visibility filter and the brand exclusion all live in SQL that
          # SQLite never executes. This job is where they are actually proved.
          TEST_DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana_test
          DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          SECRET_KEY: test-secret-not-a-real-key
          AI_OFFLINE: "true"
        run: pytest tests/test_search_postgres.py -v

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  evals:
    name: AI evals (offline fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run eval suites against fixtures, never the live API
        env:
          AI_OFFLINE: "true"
          SECRET_KEY: test-secret-not-a-real-key
        run: python -m khazana.ai.evals.run --offline

  e2e:
    name: Browser end to end
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58 does not
    # install browsers for. Move this with the Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the API and the databases
        # The same compose services as local development. AI stays offline:
        # no key, no spend.
        run: |
          docker compose build api
          docker compose up -d db redis
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api python -m khazana.seed --reset
          docker compose up -d api

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json

      - name: Build and start the web app as it ships
        # The production build, not the dev server: what a reseller's phone
        # actually downloads, and no file watching on a bind mount.
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # The standalone server, assembled the way the runtime image does it.
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=0.0.0.0 nohup node .next/standalone/server.js > ../../web.log 2>&1 &

      - name: Wait for the API and the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null               && curl -fsS http://localhost:3000/login > /dev/null; then
              echo "ready after $((i * 2)) seconds"; exit 0
            fi
            sleep 2
          done
          echo "== web"; tail -50 web.log
          echo "== api"; docker compose logs api | tail -30
          exit 1

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the money path in a phone sized browser
        working-directory: e2e
        env:
          CI: "1"
        run: npx playwright test

      - name: Upload the report when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  staging:
    name: Production stack as staging
    # Pinned for the same reason as the browser job: Playwright 1.58 cannot
    # install browsers on ubuntu-latest's 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Start docker-compose.prod.yml with the staging settings
        # The production images, Caddy, the migrate step, the scheduler and the
        # backup service, exactly as production runs them.
        run: |
          cp .env.staging.example .env.staging
          docker compose -f docker-compose.prod.yml --env-file .env.staging up -d --build

      - name: Wait for HTTPS through Caddy
        run: |
          for i in $(seq 1 90); do
            if curl -fsSk https://localhost/api/health > /dev/null \
              && curl -fsSk https://localhost/login > /dev/null; then
              echo "ready after $((i * 2)) seconds"; exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml --env-file .env.staging logs --tail 60
          exit 1

      - name: Check routing, headers and what stays private
        run: |
          set -e
          code() { curl -sk -o /dev/null -w "%{http_code}" "$1"; }
          test "$(code https://localhost/api/health)" = 200
          test "$(code https://localhost/api/metrics)" = 404
          test "$(code http://localhost/login)" = 308
          headers=$(curl -skI https://localhost/login)
          echo "$headers" | grep -qi "strict-transport-security"
          echo "$headers" | grep -qi "content-security-policy: default-src 'self'"
          curl -sk https://localhost/api/openapi.json | grep -q '"bearer"'
          docker compose -f docker-compose.prod.yml --env-file .env.staging ps --status running \
            | grep -E "scheduler|backup" | wc -l | grep -q 2

      - name: Seed the staging database
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.staging \
            exec -T api python -m khazana.seed --reset

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: The money path, through Caddy, on one origin
        working-directory: e2e
        env:
          CI: "1"
          WEB_URL: https://localhost
          API_URL: https://localhost/api
          E2E_IGNORE_HTTPS_ERRORS: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: OWASP ZAP, passive on the web app and active on every API operation
        # Fails on any finding not accepted, with its reason, in deploy/zap.
        run: bash scripts/zap-scan.sh

      - name: Upload the ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/
          if-no-files-found: ignore

      - name: Logs when something failed
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.staging logs --tail 100

  arm64:
    name: Images build and start on arm64
    # The pilot runs on an Oracle Cloud Always Free ARM machine, so every
    # change proves the production images still build there and start. A
    # native arm64 runner, free for public repositories: no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and web runtime images for arm64
        run: |
          docker build --target runtime -t khazana-api:arm64 apps/api
          docker build --target runtime --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
            -t khazana-web:arm64 apps/web
      - name: They are arm64 and they start
        run: |
          test "$(docker image inspect khazana-api:arm64 --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect khazana-web:arm64 --format '{{.Architecture}}')" = arm64
          docker run --rm khazana-api:arm64 python -c "import khazana.main; print('api imports')"
          docker run -d --name web -p 3000:3000 khazana-web:arm64
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/login > /dev/null && echo "web answers" && exit 0
            sleep 2
          done
          docker logs web
          exit 1

  scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Blocking. Findings with no fixed version are ignored, so anything left is
    # something a dependency bump can fix, and it has to be fixed before merge.
    # It was advisory until week 51, when it had been reporting a critical
    # remote code execution advisory in Next.js that nothing acted on.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan the repository for vulnerable dependencies
        # Pinned to the commit behind v0.36.0, released 2026-04-22. A third
        # party action gets a commit, not a tag: a tag can be moved to point at
        # new code, and this one runs with access to the checkout.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
