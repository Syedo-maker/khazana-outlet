name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No em dashes, no AI attribution
        run: bash scripts/prepush-check.sh

  api:
    name: API lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests
        env:
          # Tests run against SQLite, so no database service is needed here.
          # The Postgres specific paths are covered by the migration job.
          SECRET_KEY: test-secret-not-a-real-key
          AI_OFFLINE: "true"
        run: pytest --cov=khazana --cov-report=term-missing

  migrations:
    name: Migrations apply cleanly on Postgres
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: khazana
          POSTGRES_PASSWORD: khazana
          POSTGRES_DB: khazana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khazana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Upgrade then downgrade, so rollbacks are proven too
        env:
          DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          SECRET_KEY: test-secret-not-a-real-key
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  evals:
    name: AI evals (offline fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run eval suites against fixtures, never the live API
        env:
          AI_OFFLINE: "true"
          SECRET_KEY: test-secret-not-a-real-key
        run: python -m khazana.ai.evals.run --offline
