name: CI

on:
  push:
    # Feature branches are included deliberately. Without them a branch gets
    # no checks at all until it is opened as a pull request, which is exactly
    # when a late failure is most expensive to unpick.
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No em dashes, no AI attribution
        run: bash scripts/prepush-check.sh

  api:
    name: API lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check . || {
            # Print the unified diff inline as well as uploading it. The
            # development machine cannot run ruff, and artifact downloads from
            # that network have been unreliable, so the log is the fallback.
            echo "::group::formatting diff"
            ruff format --diff . || true
            echo "::endgroup::"
            ruff format --diff . > "$RUNNER_TEMP/format.patch" || true
            exit 1
          }

      - name: Upload the formatting patch when the format check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: ignore

      - name: Type check
        run: mypy src

      - name: Tests
        env:
          # Tests run against SQLite, so no database service is needed here.
          # The Postgres specific paths are covered by the migration job.
          SECRET_KEY: test-secret-not-a-real-key
          AI_OFFLINE: "true"
        run: pytest --cov=khazana --cov-report=term-missing

  migrations:
    name: Migrations apply cleanly on Postgres
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: khazana
          POSTGRES_PASSWORD: khazana
          POSTGRES_DB: khazana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khazana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Upgrade then downgrade, so rollbacks are proven too
        env:
          DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          SECRET_KEY: test-secret-not-a-real-key
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: PostgreSQL only tests, meaning vector search and the triggers
        env:
          # The suite runs on SQLite for speed, so the cosine ranking, the
          # visibility filter and the brand exclusion all live in SQL that
          # SQLite never executes. This job is where they are actually proved.
          TEST_DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          DATABASE_URL: postgresql+psycopg://khazana:khazana@localhost:5432/khazana
          SECRET_KEY: test-secret-not-a-real-key
          AI_OFFLINE: "true"
        run: pytest tests/test_search_postgres.py -v

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run build

  evals:
    name: AI evals (offline fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run eval suites against fixtures, never the live API
        env:
          AI_OFFLINE: "true"
          SECRET_KEY: test-secret-not-a-real-key
        run: python -m khazana.ai.evals.run --offline
