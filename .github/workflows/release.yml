name: Release

# Pushing a version tag, v1.0.0 for example, publishes that release: the two
# production images to the GitHub container registry, for both amd64 and
# arm64, and a GitHub release whose notes are that version's section of
# CHANGELOG.md.
#
# The images are what docker-compose.prod.yml runs with
#   IMAGE_PREFIX=ghcr.io/syedo-maker/khazana VERSION=1.0.0
# so a server pulls a tested build instead of building from source. arm64 is
# for the Oracle Cloud Always Free machine (docs/oracle-free-tier.md).
#
# Each architecture builds natively on its own runner, which is several times
# faster than emulating arm64 and avoids emulation bugs in npm and pip. The
# two builds are pushed by digest, then joined into one multi architecture
# tag, so `docker pull` picks the right one on any machine.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }} for ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            # Free for public repositories.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Work out the names
        id: names
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/khazana-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "arch=${{ matrix.platform }}" | sed 's#linux/##' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.image }}
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.names.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.names.outputs.arch }}

      - name: Smoke test the image on its own architecture
        run: |
          image="${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"
          if [ "${{ matrix.image }}" = api ]; then
            docker run --rm "$image" python -c "import khazana.main; print('api imports')"
          else
            docker run --rm "$image" sh -c 'node --version && test -f /app/server.js'
          fi

      - name: Keep the digest for the merge
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ steps.names.outputs.arch }}
          path: digests/*
          retention-days: 1

  merge:
    name: Tag ${{ matrix.image }} for both architectures
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the version and latest tags from both digests
        working-directory: digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/khazana-${{ matrix.image }}"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"

  release:
    name: Release notes
    needs: merge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) found = 1 }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Khazana Outlet $version" --notes-file notes.md
