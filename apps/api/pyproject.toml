[project]
name = "khazana-api"
version = "0.1.0"
description = "Khazana Outlet API: AI native marketplace for brand surplus stock in Pakistan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-multipart>=0.0.17",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "faker>=33.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit security checks
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]
# SQLAlchemy requires plain dicts for type_annotation_map and __mapper_args__.
# They are configuration, not mutable default arguments.
"src/khazana/models/*" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "passlib.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:khazana.*"]
