# Scrapes the API's /metrics over the compose network. The public proxy does
# not route /metrics, so this is the only way to read it.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: khazana-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
